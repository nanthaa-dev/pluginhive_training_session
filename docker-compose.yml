services:
  postgres:
    image: postgres:16
    container_name: shiphub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shiphub123
      POSTGRES_DB: shiphub
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
